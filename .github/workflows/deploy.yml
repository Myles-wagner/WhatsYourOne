# .github/workflows/deploy.yml
#
# Auto-build and deploy to GitHub Pages whenever code is pushed to master.
# This lets Claude (or anyone) edit source files on GitHub and have the
# live site update automatically - no manual npm run build needed.

name: Build and Deploy

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: whats-your-one/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: whats-your-one

      - name: Build
        run: npm run build
        working-directory: whats-your-one

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: whats-your-one/build
          clean: true
